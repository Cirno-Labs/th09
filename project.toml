# th09: 東方花映塚 ~ Phantasmagoria of Flower View, 1.50a

[game]
name = "th09"
title = "東方花映塚 1.50a"
window_title = "東方花映塚"
dir = "orig/th09_150a"
exe = "th09.exe"
checksums = "orig/th09_150a.sha1"
original = "build/th09_150a.exe"
game_end = 0x44CB5C  # D3DX8's tables, D3DX8 and the CRT follow

[ghidra]
project = "th09_150a"
functions = "build/functions_150a.csv"

[build]
# Visual C++ .NET 2003 (MSVC 7.1; the original is cl 13.10.3077, this
# is th10's SP1, 13.10.6030), the Platform SDK for Windows XP SP2 and
# the DirectX 8 SDK. The game code is optimized but keeps its frame
# pointer, and, as th08's, its functions are __fastcall by default
# (/Gr). Nothing is inlined (/Ob0).
bin = 'C:\msvc71\bin'
include = ['C:\dx8\include', 'C:\msvc71\include', 'C:\psdk\Include']
# DirectX 8.0 headers, but 8.1 libraries and the VC 7.1 RTM CRT,
# as in the original EXE; the compiler remains SP1 for function matching.
# DxErr8.lib is the legacy library from the October 2006 DirectX SDK.
lib = ['C:\dxerr8\lib', 'C:\dx81\lib', 'C:\dx8\lib', 'C:\msvc710\lib', 'C:\msvc71\lib', 'C:\psdk\Lib']
hook = "scripts/exe_layout.py"
cflags = ["/O2", "/Ob0", "/Oy-", "/Gr", "/GX"]

[exe]
obj_dir = "build/obj_exe"
defines = ["TH09_EXE=1"]
link_order = "median"
# The original was compiled with a precompiled ./system/global.h.
pch = "global.h"
ldflags = ["/SUBSYSTEM:WINDOWS", "/FIXED", "/ENTRY:WinMainCRTStartup", "/NODEFAULTLIB:libc.lib", "/FILEALIGN:512", "/NODEFAULTLIB:libci.lib"]
libs = ["dinput8.lib", "dsound.lib", "d3d8.lib", "d3dx8.lib", "dxguid.lib",
        "winmm.lib", "kernel32.lib", "user32.lib", "gdi32.lib", "advapi32.lib", "ole32.lib",
        "libcmt.lib", "dxerr8.lib"]

[exe.features]
# FEAT=orig_checksum: ChecksumExecutable reports the 1.50a exe's size and
# checksum, which the archive's version records and original replays
# expect, instead of computing them. Without it the function keeps its
# original code and size, as byte identity requires.
orig_checksum = "FEAT_ORIG_CHECKSUM"

[hooks]
progress = true
# Every commit builds and matches, but for these functions, committed
# though they don't match yet (`just farm` permutes them).
compare = true
allow_diff = [
    "App::UpdateNetPlay",
    "Player::UpdateShotInput",
    "Player::CheckHitAreas",
    "Stage::DrawLayer",
    "EclManager::RunEnemy",
    "EnemyManager::OnUpdate",
    "GameManager::LoadingThread",
    "Player::HandleInput",
    "ReplayManager::AddedCallbackMode1",
    "ReplayManager::SaveReplay",
    "ScreenEffect::OnUpdateShakeRamp",
    "MainMenu::DrawState11",
    "MainMenu::UpdateState13",
    "DrawEffectType29",
]
