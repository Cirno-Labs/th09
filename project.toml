# th09: 東方花映塚 ~ Phantasmagoria of Flower View, 1.50a

[game]
name = "th09"
title = "東方花映塚 1.50a"
window_title = "東方花映塚"
dir = "orig/th09_150a"
exe = "th09.exe"
checksums = "orig/th09_150a.sha1"
original = "build/th09_150a.exe"
game_end = 0x44CB5C  # D3DX8's tables, D3DX8 and the CRT follow

[ghidra]
project = "th09_150a"
functions = "build/functions_150a.csv"

[build]
# Visual C++ .NET 2003 (MSVC 7.1; the original is cl 13.10.3077, this
# is th10's SP1, 13.10.6030), the Platform SDK for Windows XP SP2 and
# the DirectX 8 SDK. The game code is optimized but keeps its frame
# pointer, and, as th08's, its functions are __fastcall by default
# (/Gr). Nothing is inlined (/Ob0).
bin = 'C:\msvc71\bin'
include = ['C:\dx8\include', 'C:\msvc71\include', 'C:\psdk\Include']
lib = ['C:\dx8\lib', 'C:\msvc71\lib', 'C:\psdk\Lib']
cflags = ["/O2", "/Ob0", "/Oy-", "/Gr", "/GX"]

[exe]
obj_dir = "build/obj"
link_order = "median"
libs = ["libcmt.lib", "d3dx8.lib", "d3d8.lib", "dsound.lib", "dinput8.lib", "dxguid.lib",
        "winmm.lib", "kernel32.lib", "user32.lib", "gdi32.lib", "advapi32.lib", "ole32.lib"]

[hooks]
progress = true
# Every commit builds and matches, but for these functions, committed
# though they don't match yet (`just farm` permutes them).
compare = true
allow_diff = [
    "App::UpdateNetPlay",
    "Player::UpdateShotInput",
    "Player::CheckHitAreas",
    "Stage::DrawLayer",
    "EclManager::RunEnemy",
    "EffectManager::AddedCallback",
    "EnemyManager::OnUpdate",
    "GuiMsg::Run",
    "GameManager::LoadingThread",
    "Player::HandleInput",
    "ReplayManager::AddedCallbackMode1",
    "ReplayManager::SaveReplay",
    "ScreenEffect::OnUpdateShakeRamp",
    "MainMenu::DrawState11",
    "MainMenu::UpdateState16",
    "MainMenu::UpdateState13",
    "MainMenu::UpdateState8",
    "SoundPlayer::FindTrackIndex",
    "DrawEffectType29",
    "UpdateExAttackType19",
]
